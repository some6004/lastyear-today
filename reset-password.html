<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 비밀번호 설정 — 작년, 오늘</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:90px;display:flex;align-items:center}.logo{font:30px Georgia,serif;color:var(--i);text-decoration:none}.box{padding:55px 0}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:normal 40px Georgia,serif;letter-spacing:-.05em;line-height:1.2;margin:18px 0 24px}.field{border-bottom:1px solid var(--r);padding:15px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.btn{width:100%;margin-top:25px;padding:16px;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}#msg{font-size:12px;line-height:1.8;color:#8b4a4a}.links{margin-top:25px;text-align:center;font-size:12px}.links a{color:var(--i)}</style><link rel="stylesheet" href="site-common.css">
</head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">NEW PASSWORD</div><h1 class="title">새 비밀번호를<br>설정하세요.</h1><div class="field"><input id="password" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required></div><div class="field"><input id="confirm" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required></div><p id="msg" role="status"></p><button class="btn" id="submit" onclick="savePassword()">비밀번호 변경 →</button><div class="links"><a href="login.html">로그인으로 돌아가기</a></div></main></div><script src="neon-auth.js"></script><script>async function savePassword(){const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;const msg=document.getElementById('msg');const btn=document.getElementById('submit');const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.replace(/^#/,'') );const token=params.get('token')||params.get('access_token')||hash.get('access_token');if(password.length<8){msg.textContent='비밀번호는 8자 이상 입력해 주세요.';return}if(password!==confirm){msg.textContent='비밀번호가 서로 일치하지 않습니다.';return}if(!token){msg.textContent='유효한 재설정 링크가 없습니다. 재설정 메일을 다시 요청해 주세요.';return}btn.disabled=true;try{await window.LYT_AUTH_READY;if(hash.get('access_token')&&hash.get('refresh_token')){const sessionResult=await window.LYT_AUTH_CLIENT.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(sessionResult.error)throw sessionResult.error;}const {error}=await window.LYT_AUTH_CLIENT.auth.updateUser({password});if(error)throw error;msg.style.color='#77736b';msg.textContent='비밀번호가 변경되었습니다. 로그인 화면에서 새 비밀번호로 로그인해 주세요.';btn.textContent='변경 완료';btn.disabled=true}catch(e){msg.textContent='비밀번호를 변경하지 못했습니다. 재설정 링크가 만료되었거나 유효하지 않을 수 있습니다.';btn.disabled=false}}</script><script src="site-common.js"></script>
</body></html>
