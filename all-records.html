<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0e9"><title>전체 기록 — 작년, 오늘</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="site-common.css">
<style>
:root{--paper:#f3f0e9;--ink:#24231f;--soft:#77736b;--faint:#aaa59c;--rule:#d7d2c9;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 28px}.nav{height:84px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}.logo{font:30px 'Noto Serif KR',serif;letter-spacing:-.09em;color:var(--ink);text-decoration:none}.links{display:flex;gap:18px}.links a{font-size:13px;color:var(--soft);text-decoration:none}.hero{padding:64px 0 34px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--faint);margin-bottom:16px}.hero h1{font:400 clamp(42px,7vw,66px)/1.2 'Noto Serif KR',serif;letter-spacing:-.07em;margin:0 0 18px}.hero p{color:var(--soft);font-size:14px;line-height:1.9;margin:0}.demo{margin-top:25px;padding:16px 18px;background:#e8e2d8;border-radius:12px;font-size:12px;line-height:1.8;color:#625b51}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:26px 0 18px;border-bottom:1px solid var(--ink)}.toolbar h2{font:400 26px 'Noto Serif KR',serif;margin:0}.count{font-size:12px;color:var(--soft)}.feed{padding:22px 0 100px;display:grid;gap:14px}.item{display:grid;grid-template-columns:145px 1fr;gap:22px;padding:22px;background:var(--card);border:1px solid var(--rule);text-decoration:none;color:inherit;min-width:0}.thumb{width:145px;height:130px;background:#e6e0d5 center/cover no-repeat;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.date{font-size:11px;letter-spacing:.08em;color:var(--faint)}.item h3{font:400 25px/1.45 'Noto Serif KR',serif;letter-spacing:-.05em;margin:8px 0 10px}.excerpt{font-size:13px;line-height:1.85;color:#625d55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.status{padding:40px 0;color:var(--soft);font-size:13px;line-height:1.8}.empty{padding:60px 20px;text-align:center;color:var(--soft);background:rgba(255,253,248,.6);border:1px solid var(--rule)}.empty a{display:inline-block;margin-top:18px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px;font-size:13px}.footer{border-top:1px solid var(--rule);padding:25px 0 40px;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
@media(max-width:600px){.wrap{padding:0 18px}.nav{height:70px}.logo{font-size:26px}.links{gap:12px}.links a{font-size:12px}.hero{padding:45px 0 28px}.item{grid-template-columns:92px 1fr;gap:13px;padding:13px}.thumb{width:92px;height:100px}.item h3{font-size:19px;margin:5px 0 7px}.excerpt{font-size:12px;-webkit-line-clamp:3}.toolbar h2{font-size:23px}.footer{display:block}.footer span{display:block;margin-top:8px}}
</style></head><body><div class="wrap">
<header class="nav"><a class="logo" href="index.html">작년, 오늘</a><nav class="links"><a href="write.html">기록하기 →</a><a href="ai.html">AI 검색 →</a></nav></header>
<section class="hero"><div class="eyebrow">ONE SHARED MEMORY ARCHIVE</div><h1>모든 기록을<br>한곳에서 만나요.</h1><p>기록장과 로그인으로 나누지 않고, 데모에 남겨진 모든 기록을 날짜순으로 함께 볼 수 있어요.</p><div class="demo">데모 버전 · 로그인 없이 누구나 기록을 읽고 새 기록을 남길 수 있습니다. 여기에 작성된 내용과 사진은 다른 방문자에게도 공개됩니다.</div></section>
<div class="toolbar"><h2>전체 기록</h2><span id="count" class="count">불러오는 중…</span></div><main id="feed" class="feed"><div class="status">공개된 기록을 불러오고 있어요…</div></main>
<footer class="footer"><span>© 2026 작년, 오늘</span><span>데모 기록은 모든 방문자에게 공개됩니다.</span></footer></div>
<script>
const feed=document.getElementById('feed'),count=document.getElementById('count');
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageOf(r){return r&&r.metadata?(r.metadata.imageDataUrl||r.metadata.imageUrl||''):''}
function keyDate(v){return String(v||'').slice(0,10)}
async function load(){try{const res=await fetch('/api/demo-entries',{cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'기록을 불러오지 못했습니다.');const rows=data.entries||[];count.textContent=rows.length+'개';if(!rows.length){feed.innerHTML='<div class="empty">아직 기록이 없어요.<br>첫 기록을 남겨보세요.<br><a href="write.html">기록하기 →</a></div>';return}feed.innerHTML=rows.map(r=>{const img=imageOf(r);const title=String(r.title||'').trim()||'제목 없는 기록';const body=String(r.content||'');return '<a class="item" href="record-view.html?demo=1&id='+encodeURIComponent(r.id)+'"><div class="thumb">'+(img?'<img src="'+escapeHtml(img)+'" alt="" loading="lazy">':'')+'</div><div><div class="date">'+escapeHtml(keyDate(r.entry_date))+'</div><h3>'+escapeHtml(title)+'</h3><p class="excerpt">'+escapeHtml(body)+'</p></div></a>'}).join('')}catch(e){count.textContent='불러오기 실패';feed.innerHTML='<div class="status">'+escapeHtml(e.message||'연결 오류가 발생했습니다.')+'<br>잠시 후 새로고침해 주세요.</div>'}}
load();
</script><script src="site-common.js"></script></body></html>
