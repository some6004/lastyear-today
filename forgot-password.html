<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 재설정 — 작년, 오늘</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:90px;display:flex;align-items:center}.logo{font:30px Georgia,serif;color:var(--i);text-decoration:none}.box{padding:55px 0}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:normal 40px Georgia,serif;letter-spacing:-.05em;line-height:1.2;margin:18px 0 24px}.desc{font-size:13px;color:var(--s);line-height:1.8}.field{border-bottom:1px solid var(--r);padding:15px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.btn{width:100%;margin-top:25px;padding:16px;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}.links{margin-top:25px;text-align:center;font-size:12px}.links a{color:var(--i)}#msg{font-size:12px;line-height:1.8;color:#8b4a4a}@media(max-width:600px){.box{padding-top:35px}.title{font-size:35px}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">ACCOUNT RECOVERY</div><h1 class="title">비밀번호를<br>재설정하세요.</h1><p class="desc">가입한 이메일 주소를 입력하면 재설정 안내를 요청합니다. 계정 존재 여부는 보안상 별도로 표시하지 않습니다.</p><div class="field"><input id="email" type="email" placeholder="가입한 이메일 주소" autocomplete="email" required></div><p id="msg" role="status"></p><button class="btn" id="submit" onclick="sendReset()">재설정 메일 요청 →</button><div class="links"><a href="login.html">로그인으로 돌아가기</a></div></main></div><script src="neon-auth.js"></script><script>async function sendReset(){const email=document.getElementById('email').value.trim().toLowerCase();const msg=document.getElementById('msg');const btn=document.getElementById('submit');if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){msg.textContent='이메일 주소를 확인해 주세요.';return}btn.disabled=true;msg.textContent='요청 중…';try{await window.LYT_AUTH_READY;const {error}=await window.LYT_AUTH_CLIENT.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});if(error)throw error;msg.style.color='#77736b';msg.textContent='해당 주소가 등록되어 있다면 비밀번호 재설정 안내가 발송됩니다. 메일함과 스팸함을 확인해 주세요.'}catch(e){msg.textContent='재설정 메일을 요청하지 못했습니다. 이메일 인증 및 메일 발송 설정을 확인해 주세요.'}finally{btn.disabled=false}}</script></body></html>
