<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0e9"><title>나의 기록 — 작년, 오늘</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="site-common.css">
<style>
:root{--paper:#f3f0e9;--ink:#24231f;--soft:#77736b;--faint:#aaa59c;--rule:#d7d2c9;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,sans-serif}.wrap{max-width:920px;margin:auto;padding:0 28px}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}.logo{font:30px 'Noto Serif KR',serif;letter-spacing:-.09em;text-decoration:none;color:var(--ink)}.back{color:var(--soft);font-size:13px;text-decoration:none}.hero{padding:64px 0 28px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--faint);margin-bottom:17px}.hero h1{font:400 clamp(38px,7vw,60px)/1.3 'Noto Serif KR',serif;letter-spacing:-.07em;margin:0 0 16px}.hero p{color:var(--soft);line-height:1.8;font-size:14px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0 70px;align-items:stretch}.comparison .entry{margin:0;min-width:0}.compare-label{font-size:10px;letter-spacing:.14em;color:var(--faint);margin-bottom:12px}.compare-empty{font-size:14px;line-height:1.9;color:var(--soft);padding:28px 0}.entry{background:var(--card);border:1px solid var(--rule);padding:clamp(24px,5vw,52px);margin:22px 0 70px;min-height:240px}.entry-date{color:var(--faint);font-size:12px;letter-spacing:.04em}.entry h2{font:400 clamp(26px,4vw,38px)/1.5 'Noto Serif KR',serif;letter-spacing:-.06em;margin:22px 0 25px;white-space:pre-wrap;overflow-wrap:anywhere}.entry h2{display:none!important;margin:0!important;padding:0!important;height:0!important;overflow:hidden!important}.entry-body{font:400 17px/2.05 'Noto Serif KR',serif;white-space:pre-wrap;overflow-wrap:anywhere;color:#514d46}.entry img{display:block;max-width:100%;max-height:560px;object-fit:contain;margin:28px auto 0}.meta{border-top:1px solid var(--rule);margin-top:35px;padding-top:16px;color:var(--faint);font-size:11px;display:flex;justify-content:space-between;gap:12px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.actions a{color:var(--ink);text-decoration:none;font-size:13px;border-bottom:1px solid var(--rule);padding:8px 0}.status{color:var(--soft);line-height:1.8;font-size:14px;padding:30px 0}.badge{font-size:10px;color:var(--soft);border:1px solid var(--rule);padding:5px 8px;border-radius:99px}@media(max-width:650px){.comparison{grid-template-columns:1fr;gap:4px}.comparison .entry{margin:0 0 16px}}@media(max-width:600px){.wrap{padding:0 18px}.nav{height:72px}.hero{padding:45px 0 20px}.entry{padding:23px 20px}.entry-body{font-size:16px}.meta{flex-direction:column}}
</style></head><body><div class="wrap">
<header class="nav"><a class="logo" href="index.html">작년, 오늘</a><a class="back" href="records.html">내 기록 목록 ←</a></header>
<section class="hero"><div class="eyebrow">TODAY & ONE YEAR AGO</div><h1>오늘과 작년 오늘,<br>두 개의 하루</h1><p>오늘 남긴 기록과 1년 전 오늘의 기록을<br>나란히 놓고 다시 읽어보세요.</p></section>
<div id="status" class="status" role="status">소중한 기록을 불러오고 있어요…</div>
<div id="comparison" class="comparison" hidden><article id="entry" class="entry"><div class="compare-label">TODAY · 오늘 남긴 기록</div><div class="entry-date" id="date"></div><h2 id="title"></h2><div id="content" class="entry-body"></div><img id="photo" alt="오늘 기록에 첨부한 사진" hidden><div class="meta"><span id="visibility"></span><span>작년, 오늘에 보관된 기록</span></div></article><article id="pastEntry" class="entry"><div class="compare-label">ONE YEAR AGO · 작년 오늘</div><div class="entry-date" id="pastDate"></div><h2 id="pastTitle"></h2><div id="pastContent" class="entry-body"></div><img id="pastPhoto" alt="작년 오늘 기록에 첨부한 사진" hidden><div class="meta"><span id="pastVisibility"></span><span>1년 전 같은 날</span></div></article></div><div class="actions"><a href="write.html">새 기록 남기기 →</a><a href="records.html">내 기록 모아보기</a></div>
</div><script src="neon-auth.js?v=20261010-6"></script><script>
(async function(){
 const status=document.getElementById('status'), card=document.getElementById('comparison');
 try{
  const client=window.LYT_AUTH_CLIENT;
  if(!client)throw new Error('로그인 정보를 확인하지 못했어요. 다시 로그인해 주세요.');
  const {data:{session},error}=await client.auth.getSession();
  if(error)throw error;
  if(!session||!session.access_token){status.innerHTML='기록을 보려면 먼저 <a href="login.html?redirect=record-view.html" style="color:inherit">로그인</a>해 주세요.';return;}
  const id=new URLSearchParams(location.search).get('id');
  if(!id)throw new Error('열어볼 기록을 찾지 못했어요.');
  const response=await fetch('/api/entries?id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'기록을 불러오지 못했어요.');
  const r=result.entry;
  function fillRecord(prefix,record,label){
    const dateEl=document.getElementById(prefix+'Date');
    if(dateEl)dateEl.textContent=String(record.entry_date).slice(0,10).replaceAll('-','. ');
    const titleEl=document.getElementById(prefix+'Title');
    if(titleEl)titleEl.textContent=record.title||label;
    const contentEl=document.getElementById(prefix+'Content');
    if(contentEl)contentEl.textContent=record.content||'';
    const vis=document.getElementById(prefix+'Visibility');if(vis)vis.textContent=record.visibility==='public'?'공개 기록':'나만 볼 수 있는 기록';
    const meta=record.metadata||{},src=meta.imageDataUrl||meta.imageUrl||'';
    const img=document.getElementById(prefix+'Photo');if(img&&src){img.src=src;img.hidden=false;}
  }
  fillRecord('',r,'오늘의 기록');
  const dateText=String(r.entry_date).slice(0,10),dt=new Date(dateText+'T12:00:00');
  dt.setFullYear(dt.getFullYear()-1);
  const pastKey=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  document.querySelector('.compare-label').textContent='SAVED ENTRY · 저장한 기록';
  document.getElementById('pastDate').textContent=pastKey.replaceAll('-','. ');
  document.getElementById('pastTitle').textContent='작년 오늘의 기록';
  document.getElementById('pastContent').textContent='작년 오늘에 남긴 기록을 찾아보고 있어요…';
  const pastResponse=await fetch('/api/entries?date='+encodeURIComponent(pastKey),{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});
  const pastResult=await pastResponse.json();
  if(pastResponse.ok){
    const past=(pastResult.entries||[]).find(item=>String(item.entry_date).slice(0,10)===pastKey);
    if(past){fillRecord('past',past,'작년 오늘의 기록');}
    else{document.getElementById('pastContent').textContent='작년 오늘에는 아직 저장된 기록이 없어요. 오늘의 기록을 남긴 것처럼, 그날의 하루도 떠올려 보세요.';document.getElementById('pastVisibility').textContent='기록 없음';}
  }else{document.getElementById('pastContent').textContent='작년 오늘의 기록을 불러오지 못했어요.';}
  status.hidden=true;card.hidden=false;
 }catch(e){status.textContent=e.message||'기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';}
})();
</script></body></html>
