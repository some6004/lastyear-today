<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0e9"><title>나의 기록 — 작년, 오늘</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="site-common.css">
<style>
:root{--paper:#f3f0e9;--ink:#24231f;--soft:#77736b;--faint:#aaa59c;--rule:#d7d2c9;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,sans-serif}.wrap{max-width:920px;margin:auto;padding:0 28px}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}.logo{font:30px 'Noto Serif KR',serif;letter-spacing:-.09em;text-decoration:none;color:var(--ink)}.back{color:var(--soft);font-size:13px;text-decoration:none}.hero{padding:64px 0 28px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--faint);margin-bottom:17px}.hero h1{font:400 clamp(38px,7vw,60px)/1.3 'Noto Serif KR',serif;letter-spacing:-.07em;margin:0 0 16px}.hero p{color:var(--soft);line-height:1.8;font-size:14px}.entry{background:var(--card);border:1px solid var(--rule);padding:clamp(24px,5vw,52px);margin:22px 0 70px;min-height:240px}.entry-date{color:var(--faint);font-size:12px;letter-spacing:.04em}.entry h2{font:400 clamp(26px,4vw,38px)/1.5 'Noto Serif KR',serif;letter-spacing:-.06em;margin:22px 0 25px;white-space:pre-wrap;overflow-wrap:anywhere}.entry-body{font:400 17px/2.05 'Noto Serif KR',serif;white-space:pre-wrap;overflow-wrap:anywhere;color:#514d46}.entry img{display:block;max-width:100%;max-height:560px;object-fit:contain;margin:28px auto 0}.meta{border-top:1px solid var(--rule);margin-top:35px;padding-top:16px;color:var(--faint);font-size:11px;display:flex;justify-content:space-between;gap:12px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.actions a{color:var(--ink);text-decoration:none;font-size:13px;border-bottom:1px solid var(--rule);padding:8px 0}.status{color:var(--soft);line-height:1.8;font-size:14px;padding:30px 0}.badge{font-size:10px;color:var(--soft);border:1px solid var(--rule);padding:5px 8px;border-radius:99px}@media(max-width:600px){.wrap{padding:0 18px}.nav{height:72px}.hero{padding:45px 0 20px}.entry{padding:23px 20px}.entry-body{font-size:16px}.meta{flex-direction:column}}
</style></head><body><div class="wrap">
<header class="nav"><a class="logo" href="index.html">작년, 오늘</a><a class="back" href="records.html">내 기록 목록 ←</a></header>
<section class="hero"><div class="eyebrow">A MOMENT TO KEEP</div><h1>오늘 남긴 기록</h1><p>하루의 작은 순간을 여기에 담아두었어요.<br>언제든 다시 찾아와 천천히 읽어보세요.</p></section>
<div id="status" class="status" role="status">소중한 기록을 불러오고 있어요…</div>
<article id="entry" class="entry" hidden><div class="entry-date" id="date"></div><h2 id="title"></h2><div id="content" class="entry-body"></div><img id="photo" alt="기록에 첨부한 사진" hidden><div class="meta"><span id="visibility"></span><span>작년, 오늘에 보관된 기록</span></div><div class="actions"><a href="write.html">새 기록 남기기 →</a><a href="records.html">내 기록 모아보기</a></div></article>
</div><script src="neon-auth.js?v=20261010-6"></script><script>
(async function(){
 const status=document.getElementById('status'), card=document.getElementById('entry');
 try{
  const client=window.LYT_AUTH_CLIENT;
  if(!client)throw new Error('로그인 정보를 확인하지 못했어요. 다시 로그인해 주세요.');
  const {data:{session},error}=await client.auth.getSession();
  if(error)throw error;
  if(!session||!session.access_token){status.innerHTML='기록을 보려면 먼저 <a href="login.html?redirect=record-view.html" style="color:inherit">로그인</a>해 주세요.';return;}
  const id=new URLSearchParams(location.search).get('id');
  if(!id)throw new Error('열어볼 기록을 찾지 못했어요.');
  const response=await fetch('/api/entries?id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'기록을 불러오지 못했어요.');
  const r=result.entry;
  document.getElementById('date').textContent=String(r.entry_date).slice(0,10).replaceAll('-','. ');
  document.getElementById('title').textContent=r.title||'오늘의 기록';
  document.getElementById('content').textContent=r.content||'';
  document.getElementById('visibility').textContent=r.visibility==='public'?'공개 기록':'나만 볼 수 있는 기록';
  const meta=r.metadata||{},src=meta.imageDataUrl||meta.imageUrl||'';
  if(src){const img=document.getElementById('photo');img.src=src;img.hidden=false;}
  status.hidden=true;card.hidden=false;
 }catch(e){status.textContent=e.message||'기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';}
})();
</script></body></html>
