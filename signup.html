<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — 작년, 오늘</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:92px;display:flex;align-items:center}.logo{font:400 30px/1 "Noto Serif KR";text-decoration:none;color:var(--i);letter-spacing:-.09em}.logo span{display:inline-block}.logo span:nth-child(1){color:#c99da5}.logo span:nth-child(2){color:#9eaf98}.logo span:nth-child(3){color:#c4af91}.logo span:nth-child(4){color:#a89bb2}.box{padding:70px 0 100px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:400 50px "Noto Serif KR";letter-spacing:-.07em;margin:18px 0 35px}.field{border-bottom:1px solid var(--r);padding:14px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.login{width:100%;margin-top:28px;padding:15px 0;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard}.social{margin-top:34px;border-top:1px solid var(--r);padding-top:24px}.social-title{font-size:11px;color:var(--s);margin-bottom:12px}.social button{width:100%;padding:13px;margin-bottom:8px;border:1px solid var(--r);background:#fffdf8;font:13px Pretendard;cursor:pointer}.links{margin-top:25px;text-align:center;font-size:12px;color:var(--s)}.links a{color:var(--i);text-decoration:none;border-bottom:1px solid var(--i)}@media(max-width:600px){.top{height:72px}.box{padding-top:55px}.title{font-size:42px}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html"><span>작</span><span>년</span><span>,</span><span> 오늘</span></a></header><main class="box"><div class="ey">JOIN</div><h1 class="title">당신의 기록을<br>시작해보세요.</h1><div class="field"><input placeholder="아이디" autocomplete="username"></div><div class="field"><input type="password" placeholder="패스워드" autocomplete="current-password"></div><button class="login" onclick="location.href='my-info.html'">회원가입하고 시작하기 →</button><div class="social"><div class="social-title">간편 로그인</div><button onclick="alert('카카오 로그인은 실제 서비스에서 연결됩니다.')">카카오톡으로 로그인</button><button onclick="alert('네이버 로그인은 실제 서비스에서 연결됩니다.')">네이버로 로그인</button><button onclick="alert('Google 로그인은 실제 서비스에서 연결됩니다.')">Google로 로그인</button></div><div class="links">이미 계정이 있으신가요? <a href="login.html">로그인</a></div></main></div></body></html>
