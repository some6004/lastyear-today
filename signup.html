<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — 작년, 오늘</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:92px;display:flex;align-items:center}.logo{font:400 30px/1 "Noto Serif KR";text-decoration:none;color:var(--i);letter-spacing:-.09em}.box{padding:45px 0 70px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:400 42px "Noto Serif KR";letter-spacing:-.07em;margin:18px 0 25px}.field{border-bottom:1px solid var(--r);padding:12px 0}.field label{display:block;font-size:11px;color:var(--s);margin-bottom:8px}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.login{width:100%;margin-top:25px;padding:15px 0;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}.social{margin-top:26px;border-top:1px solid var(--r);padding-top:20px}.social-title{font-size:12px;color:var(--s);margin-bottom:12px}.social button{width:100%;padding:13px;margin-bottom:8px;border:1px solid var(--r);background:#fffdf8;font:14px Pretendard;cursor:pointer}.links{margin-top:24px;text-align:center;font-size:12px;color:var(--s)}.links a{color:var(--i);text-decoration:none;border-bottom:1px solid var(--i)}.hint{font-size:11px;line-height:1.6;color:var(--s);margin-top:12px}@media(max-width:600px){.top{height:72px}.title{font-size:36px}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">JOIN</div><h1 class="title">간단하게 가입하고<br>기록을 시작하세요.</h1><div class="field"><label for="authId">아이디</label><input id="authId" type="text" placeholder="영문 소문자·숫자·밑줄, 3~24자" autocomplete="username" required></div><div class="field"><label for="authPassword">비밀번호</label><input id="authPassword" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="authName">이름 (본명)</label><input id="authName" type="text" placeholder="이름" autocomplete="name" required></div><div class="field"><label for="authNickname">표시할 대화명</label><input id="authNickname" type="text" placeholder="이름, 별명, 아이디 등 원하는 이름" autocomplete="nickname" maxlength="40" required></div><div class="field"><label for="authBirth">생년월일</label><input id="authBirth" type="date" autocomplete="bday" required></div><div class="field"><label for="authPhone">전화번호</label><input id="authPhone" type="tel" placeholder="01012345678" autocomplete="tel" required></div><p class="hint">이메일 인증과 본인인증은 진행하지 않습니다. 입력한 정보는 계정 및 프로필 관리 목적으로 Neon 데이터베이스에 저장됩니다.</p><p id="authMessage" role="status" style="font-size:12px;line-height:1.7;color:#77736b"></p><button class="login" id="authSubmit" onclick="signUp()">가입하고 시작하기 →</button><div class="social"><div class="social-title">또는 간편 로그인</div><button onclick="socialLogin('kakao')">카카오톡으로 가입 / 로그인</button><button onclick="socialLogin('naver')">네이버로 가입 / 로그인</button></div><div class="links">이미 계정이 있으신가요? <a href="login.html">로그인</a></div></main></div><script src="neon-auth.js"></script><script>
const auth=window.LYT_AUTH_CLIENT;const alias=id=>id.trim().toLowerCase()+'@accounts.lastyear-today.app';
async function signUp(){const id=document.getElementById('authId').value.trim().toLowerCase();const password=document.getElementById('authPassword').value;const name=document.getElementById('authName').value.trim();const nickname=document.getElementById('authNickname').value.trim();const birth=document.getElementById('authBirth').value;const phone=document.getElementById('authPhone').value.replace(/[\s-]/g,'');const msg=document.getElementById('authMessage');const btn=document.getElementById('authSubmit');if(!/^[a-z0-9_]{3,24}$/.test(id)){msg.textContent='아이디는 영문 소문자, 숫자, 밑줄로 3~24자 입력해 주세요.';return}if(password.length<8||!name||!nickname||!birth||!/^\+?\d{9,15}$/.test(phone)){msg.textContent='비밀번호, 이름, 생년월일, 전화번호를 확인해 주세요.';return}btn.disabled=true;msg.textContent='가입 중…';try{const {data,error}=await auth.auth.signUp({email:alias(id),password,name});if(error)throw error;const session=data&&data.session;if(!session?.access_token){msg.textContent='계정이 생성됐지만 자동 로그인되지 않았습니다. 로그인 화면에서 다시 시도해 주세요.';return}const response=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({username:id,name,nickname,birth_date:birth,phone})});const result=await response.json();if(!response.ok)throw new Error(result.error||'프로필 저장에 실패했습니다.');location.href='journals.html'}catch(e){msg.style.color='#8b4a4a';msg.textContent=e.message||'회원가입에 실패했습니다.'}finally{btn.disabled=false}}
function socialLogin(provider){document.getElementById('authMessage').textContent=provider==='kakao'?'카카오 개발자 앱 키 연결 후 사용할 수 있습니다.':'네이버 개발자 앱 키 연결 후 사용할 수 있습니다.'}
document.addEventListener('keydown',e=>{if(e.key==='Enter')signUp()});
</script></body></html>
