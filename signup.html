<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — 작년, 오늘</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:92px;display:flex;align-items:center}.logo{font:400 30px/1 "Noto Serif KR";text-decoration:none;color:var(--i);letter-spacing:-.09em}.box{padding:45px 0 70px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:400 42px "Noto Serif KR";letter-spacing:-.07em;margin:18px 0 25px}.field{border-bottom:1px solid var(--r);padding:12px 0}.field label{display:block;font-size:11px;color:var(--s);margin-bottom:8px}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.login{width:100%;margin-top:25px;padding:15px 0;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}.social{margin-top:26px;border-top:1px solid var(--r);padding-top:20px}.social-title{font-size:12px;color:var(--s);margin-bottom:12px}.social button{width:100%;padding:13px;margin-bottom:8px;border:1px solid var(--r);background:#fffdf8;font:14px Pretendard;cursor:pointer}.links{margin-top:24px;text-align:center;font-size:12px;color:var(--s)}.links a{color:var(--i);text-decoration:none;border-bottom:1px solid var(--i)}.hint{font-size:11px;line-height:1.6;color:var(--s);margin-top:12px}.consents{margin:20px 0 8px;display:grid;gap:12px}.consents label{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.7;color:var(--s)}.consents input{margin-top:4px;flex:0 0 auto}.consents strong{color:var(--i)}.consents a{color:var(--i);text-decoration:underline}@media(max-width:600px){.top{height:72px}.title{font-size:36px}}</style><link rel="stylesheet" href="site-common.css">
</head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">JOIN</div><h1 class="title">간단하게 가입하고<br>기록을 시작하세요.</h1><div class="field"><label for="authEmail">이메일 주소 (로그인·인증·비밀번호 재설정)</label><input id="authEmail" type="email" placeholder="실제로 확인할 수 있는 이메일" autocomplete="email" required></div><div class="field"><label for="authPassword">비밀번호</label><input id="authPassword" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="authName">이름 (본명)</label><input id="authName" type="text" placeholder="이름" autocomplete="name" required></div><div class="field"><label for="authNickname">표시할 대화명</label><input id="authNickname" type="text" placeholder="이름, 별명, 아이디 등 원하는 이름" autocomplete="nickname" maxlength="40" required></div><div class="field"><label for="authBirth">생년월일</label><input id="authBirth" type="date" autocomplete="bday" required></div><div class="field"><label for="authPhone">전화번호</label><input id="authPhone" type="tel" placeholder="01012345678" autocomplete="tel" required></div><p class="hint">가입과 로그인 시 이메일 인증은 생략합니다. 비밀번호 재설정 시에만 이메일로 본인 확인을 진행합니다.</p><div class="consents"><label><input id="privacyConsent" type="checkbox" required><span><strong>[필수]</strong> 개인정보 수집·이용에 동의합니다. <a href="privacy.html" target="_blank" rel="noopener">처리방침 보기</a></span></label><label><input id="marketingConsent" type="checkbox"><span><strong>[선택]</strong> 이벤트·프로모션 등 광고성 이메일 수신에 동의합니다.</span></label></div><p id="authMessage" role="status" style="font-size:12px;line-height:1.7;color:#77736b"></p><button class="login" id="authSubmit" onclick="signUp()">가입하고 시작하기 →</button><div class="social"><div class="social-title">또는 간편 로그인</div><button onclick="socialLogin('google')">Google로 가입 / 로그인</button><button onclick="socialLogin('kakao')">카카오톡으로 가입 / 로그인</button><button onclick="socialLogin('naver')">네이버로 가입 / 로그인</button></div><div class="links">이미 계정이 있으신가요? <a href="login.html">로그인</a></div></main></div><script src="neon-auth.js?v=20261010-6"></script><script>
const auth=window.LYT_AUTH_CLIENT;
async function signUp(){const email=document.getElementById('authEmail').value.trim().toLowerCase();const password=document.getElementById('authPassword').value;const name=document.getElementById('authName').value.trim();const nickname=document.getElementById('authNickname').value.trim();const birth=document.getElementById('authBirth').value;const phone=document.getElementById('authPhone').value.replace(/[\s-]/g,'');const privacyConsent=document.getElementById('privacyConsent').checked;const marketingConsent=document.getElementById('marketingConsent').checked;const msg=document.getElementById('authMessage');const btn=document.getElementById('authSubmit');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='이메일 주소를 확인해 주세요.';return}if(password.length<8||!name||!nickname||!birth||!/^\+?\d{9,15}$/.test(phone)){msg.textContent='비밀번호, 이름, 생년월일, 전화번호를 확인해 주세요.';return}if(!privacyConsent){msg.textContent='필수 개인정보 수집·이용 동의가 필요합니다.';return}btn.disabled=true;msg.textContent='가입 중…';try{await window.LYT_AUTH_READY;const {data,error}=await auth.auth.signUp({email,password,options:{data:{name,nickname,birth_date:birth,phone}}});if(error){const message=String(error.message||'');if(/already exists|already registered|user exists|duplicate/i.test(message)){msg.style.color='#8b4a4a';msg.innerHTML='이미 가입된 이메일입니다. <a href="login.html" style="color:inherit;text-decoration:underline">로그인 화면으로 이동</a>해 주세요.';return}throw error}const session=data&&data.session;if(!session?.access_token){msg.style.color='#8b4a4a';msg.textContent='계정은 생성됐지만 자동 로그인 세션이 발급되지 않았습니다. 이메일 인증 설정과 Neon Auth 세션 설정을 확인한 뒤 로그인 화면에서 다시 시도해 주세요.';return}const response=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({name,nickname,birth_date:birth,phone,email,privacy_consent:true,privacy_policy_version:'2026-10-10',marketing_email_consent:marketingConsent})});const result=await response.json();if(!response.ok)throw new Error(result.error||'프로필 저장에 실패했습니다.');location.href='journals.html';}catch(e){msg.style.color='#8b4a4a';msg.textContent=e.message||'회원가입에 실패했습니다.'}finally{btn.disabled=false}}
async function socialLogin(provider){const msg=document.getElementById('authMessage');msg.style.color='#8b4a4a';if(provider!=='google'){msg.textContent=(provider==='kakao'?'카카오':'네이버')+' 로그인은 준비 중입니다.';return}msg.textContent='Google 로그인으로 이동합니다…';try{const {error}=await auth.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/journals.html'}});if(error)throw error}catch(e){msg.textContent=e.message||'Google 로그인 연결에 실패했습니다.'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')signUp()});
</script><script src="site-common.js"></script>
</body></html>
