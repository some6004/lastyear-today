<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0e9"><title>시연 기록 — 작년, 오늘</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f0e9;--ink:#24231f;--soft:#77736b;--faint:#aaa59c;--rule:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.page{max-width:1180px;margin:auto;padding:0 34px}.top{height:92px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}.logo{font:400 30px/1 "Noto Serif KR",serif;letter-spacing:-.09em;text-decoration:none;color:var(--ink)}.logo span{display:inline-block}.logo span:nth-child(1){color:#c99da5;transform:translateY(1px)}.logo span:nth-child(2){color:#9eaf98;transform:translateY(-1px)}.logo span:nth-child(3){color:#c4af91;transform:translateY(2px)}.logo span:nth-child(4){color:#a89bb2;transform:translateY(0)}.nav{display:flex;gap:25px}.nav a{font-size:13px;color:var(--soft);text-decoration:none}.main{padding:74px 0 120px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:48px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--soft);margin-bottom:20px}.title{font:400 clamp(48px,6vw,76px)/1.05 "Noto Serif KR",serif;letter-spacing:-.075em;margin:0}.intro p{max-width:360px;color:var(--soft);font-size:14px;line-height:1.8;margin:0}.calendar-head{border-top:1px solid var(--ink);padding:20px 0 18px;display:flex;justify-content:space-between;align-items:center}.years{display:flex;gap:15px;align-items:center;margin-top:7px}.year{border:0;background:none;padding:0;color:#aaa59c;font:400 11px Pretendard;cursor:pointer}.year.active{color:var(--ink);font-weight:500}.year:hover{color:var(--ink)}.month{font:400 31px "Noto Serif KR",serif;letter-spacing:-.06em}.month small{font:400 13px Pretendard;color:var(--soft);margin-left:9px}.arrows{display:flex;gap:18px}.arrow{border:0;background:none;color:var(--soft);font-size:13px;cursor:pointer;padding:7px}.arrow:hover{color:var(--ink)}.week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.week div{padding:13px 9px;font-size:11px;color:var(--faint)}.week div:first-child{color:#b58e94}.week div:last-child{color:#98a493}.grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--rule)}.day{min-height:145px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px;position:relative;cursor:pointer;overflow:hidden}.day:hover{background:#eeebe4}.day.empty{cursor:default}.num{font-size:11px;color:var(--soft);position:relative;z-index:2}.day.today .num{color:var(--ink);font-weight:600}.thumb{position:absolute;inset:32px 8px 8px;background-size:cover;background-position:center;filter:saturate(.82);transition:filter .2s}.day:hover .thumb{filter:saturate(1)}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.3))}.mark{position:absolute;right:9px;top:12px;width:5px;height:5px;border-radius:50%;background:#c4af91}.detail{margin-top:70px;border-top:1px solid var(--ink);padding-top:25px;display:grid;grid-template-columns:180px 1fr;gap:55px}.detail-date{color:var(--soft);font-size:12px}.detail-title{font:400 29px "Noto Serif KR",serif;margin:0 0 13px;letter-spacing:-.05em}.detail-text{font:400 16px/1.9 "Noto Serif KR",serif;color:#555149;max-width:700px}.detail-image{width:100%;max-width:460px;height:240px;object-fit:cover;margin-top:25px;display:none}.empty-note{color:var(--faint);font-size:13px}.loading-panel{display:flex;align-items:center;gap:13px;padding:24px 18px;margin:0 0 22px;background:rgba(255,253,248,.7);border:1px solid var(--rule);color:var(--soft);font-size:13px;line-height:1.7}.loading-spinner{width:20px;height:20px;border:2px solid #d8d2c8;border-top-color:#77736b;border-radius:50%;animation:records-spin .8s linear infinite;flex:none}@keyframes records-spin{to{transform:rotate(360deg)}}.loading-panel[hidden]{display:none}.footer{border-top:1px solid var(--rule);padding:28px 0 45px;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
@media(max-width:700px){.page{padding:0 18px}.top{height:72px}.nav{gap:13px}.nav a:not(:last-child){display:none}.main{padding:48px 0 85px}.intro{display:block;margin-bottom:38px}.intro p{margin-top:20px}.calendar-head{padding:18px 0 17px}.month{font-size:27px}.years{gap:12px;margin-top:6px}.week div{padding:11px 3px;text-align:center}.day{min-height:92px;padding:7px}.thumb{inset:28px 5px 5px}.detail{margin-top:55px;display:block}.detail-date{margin-bottom:18px}.detail-image{height:190px}.footer{display:block}.footer span{display:block;margin-top:8px}}
</style><link rel="stylesheet" href="site-common.css">
</head>
<body><div class="page">
<header class="top"><a class="logo" href="index.html" aria-label="작년, 오늘"><span>작</span><span>년</span><span>,</span><span> 오늘</span></a><nav class="nav"><a href="write.html">기록하기</a><a href="index.html">돌아가기</a></nav></header>
<main class="main">
<section class="intro"><div><div class="eyebrow">MY RECORDS</div><h1 class="title">나의 기록</h1></div><p id="recordsStatus">저장된 기록을 불러오는 중…</p></section>
<div id="loadingPanel" class="loading-panel" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span>나의 기록을 불러오고 있어요.<br>잠시만 기다려 주세요.</span></div><section class="calendar"><div class="calendar-head"><div><div class="month" id="monthLabel"></div><div class="years" id="years"></div></div><div class="arrows"><button class="arrow" type="button" onclick="changeMonth(-1)">← 이전</button><button class="arrow" type="button" onclick="changeMonth(1)">다음 →</button></div></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="calendar"></div></section>
<section class="detail" id="detail"><div class="detail-date" id="detailDate">날짜를 선택하세요</div><div><h2 class="detail-title" id="detailTitle">기록이 있는 날을 눌러보세요.</h2><div class="detail-text" id="detailText">달력의 썸네일을 누르면 그날의 기록이 아래에 나타납니다.</div><img class="detail-image" id="detailImage" alt="선택한 기록의 이미지"></div></section>
</main><footer class="footer"><span>© 2026 작년, 오늘</span><span>나의 모든 기록을 기억하는 개인 AI 아카이브</span></footer></div>
<script src="neon-auth.js?v=20261010-6"></script>
<script>
const records = Object.create(null);
let view = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
const cal = document.getElementById('calendar');
const label = document.getElementById('monthLabel');
const years = document.getElementById('years');
const statusEl = document.getElementById('recordsStatus');
const loadingPanel = document.getElementById('loadingPanel');
const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function imageFor(r){return r && r.metadata ? (r.metadata.imageDataUrl || r.metadata.imageUrl || '') : ''}
function render(){
 const y=view.getFullYear(),m=view.getMonth();
 years.innerHTML='';
 for(let yy=y+2;yy>=y-2;yy--){
  const b=document.createElement('button');b.className='year'+(yy===y?' active':'');b.textContent=yy;
  b.onclick=()=>{view=new Date(yy,view.getMonth(),1);render()};years.appendChild(b);
 }
 label.innerHTML=y+'년 <small>'+monthNames[m]+'</small>';
 cal.innerHTML='';
 const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';cal.appendChild(e)}
 for(let d=1;d<=last;d++){
  const el=document.createElement('div');el.className='day';
  const k=dateKey(y,m,d),r=records[k],img=imageFor(r);
  const num=document.createElement('span');num.className='num';num.textContent=d;el.appendChild(num);
  if(k===dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))el.classList.add('today');
  if(r){
   const mark=document.createElement('span');mark.className='mark';el.appendChild(mark);
   if(img){const thumb=document.createElement('div');thumb.className='thumb';thumb.style.backgroundImage='url("'+img.replace(/"/g,'%22')+'")';el.appendChild(thumb)}
   el.onclick=()=>showRecord(k,r);
   el.setAttribute('role','button');el.setAttribute('tabindex','0');
   el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showRecord(k,r)}};
  }
  cal.appendChild(el);
 }
}
function showRecord(k,r){
 document.getElementById('detailDate').textContent=k.replaceAll('-','.');
 document.getElementById('detailTitle').textContent=r.title||'제목 없는 기록';
 document.getElementById('detailText').textContent=r.content||'';
 const img=document.getElementById('detailImage'),src=imageFor(r);
 if(src){img.src=src;img.style.display='block'}else{img.removeAttribute('src');img.style.display='none'}
 document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
async function loadRecords(){
 try{
  loadingPanel.hidden=false;
  statusEl.textContent='시연 기록을 불러오고 있어요. 잠시만 기다려 주세요.';
  const response=await fetch('/api/demo-entries',{cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'기록을 불러오지 못했습니다.');
  (result.entries||[]).forEach(r=>{
   const k=String(r.entry_date).slice(0,10);
   if(!records[k])records[k]=r;
  });
  statusEl.textContent=Object.keys(records).length?'공용 시연 기록 '+Object.keys(records).length+'개':'아직 저장된 시연 기록이 없습니다. 기록하기에서 첫 기록을 남겨보세요.';
  loadingPanel.hidden=true;
  render();
 }catch(e){
  console.error('demo records load failed',e);
  statusEl.textContent='시연 기록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
  loadingPanel.hidden=true;
  render();
 }
}
render();
loadRecords();
</script><script src="site-common.js"></script>
</body></html>
