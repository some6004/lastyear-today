<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — 작년, 오늘</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:92px;display:flex;align-items:center}.logo{font:400 30px/1 "Noto Serif KR";text-decoration:none;color:var(--i);letter-spacing:-.09em}.box{padding:60px 0 90px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:400 46px "Noto Serif KR";letter-spacing:-.07em;margin:18px 0 35px}.field{border-bottom:1px solid var(--r);padding:14px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.login{width:100%;margin-top:28px;padding:15px 0;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}.social{margin-top:30px;border-top:1px solid var(--r);padding-top:22px}.social-title{font-size:12px;color:var(--s);margin-bottom:12px}.social button{width:100%;padding:14px;margin-bottom:8px;border:1px solid var(--r);background:#fffdf8;font:14px Pretendard;cursor:pointer}.links{margin-top:25px;text-align:center;font-size:12px;color:var(--s)}.links a{color:var(--i);text-decoration:none;border-bottom:1px solid var(--i)}@media(max-width:600px){.top{height:72px}.box{padding-top:45px}.title{font-size:40px}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">LOGIN</div><h1 class="title">다시 만나서<br>반가워요.</h1><div class="field"><input id="authId" type="text" placeholder="아이디" autocomplete="username" required></div><div class="field"><input id="authPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required></div><p id="authMessage" role="status" style="font-size:12px;line-height:1.7;color:#8b4a4a"></p><button class="login" id="authSubmit" onclick="signIn()">아이디로 로그인 →</button><div class="social"><div class="social-title">간편 로그인</div><button onclick="socialLogin('kakao')">카카오톡으로 로그인</button><button onclick="socialLogin('naver')">네이버로 로그인</button></div><div class="links">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></div></main></div><script src="neon-auth.js"></script><script>
const auth=window.LYT_AUTH_CLIENT;const alias=id=>id.trim().toLowerCase()+'@accounts.lastyear-today.app';
async function signIn(){const id=document.getElementById('authId').value.trim();const password=document.getElementById('authPassword').value;const msg=document.getElementById('authMessage');const btn=document.getElementById('authSubmit');if(!/^[a-zA-Z0-9_]{3,24}$/.test(id)||!password){msg.textContent='아이디와 비밀번호를 확인해 주세요.';return}btn.disabled=true;msg.textContent='로그인 중…';try{const {error}=await auth.auth.signInWithPassword({email:alias(id),password});if(error)throw error;location.href='journals.html'}catch(e){msg.textContent=e.message||'로그인에 실패했습니다.'}finally{btn.disabled=false}}
function socialLogin(provider){document.getElementById('authMessage').textContent=provider==='kakao'?'카카오 개발자 앱 키 연결 후 사용할 수 있습니다.':'네이버 개발자 앱 키 연결 후 사용할 수 있습니다.'}
document.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
</script></body></html>
