<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — 작년, 오늘</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:92px;display:flex;align-items:center}.logo{font:400 30px/1 "Noto Serif KR";text-decoration:none;color:var(--i);letter-spacing:-.09em}.box{padding:60px 0 70px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:400 46px "Noto Serif KR";letter-spacing:-.07em;margin:18px 0 35px}.field{border-bottom:1px solid var(--r);padding:14px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.login{width:100%;margin-top:28px;padding:15px 0;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}.login:disabled{opacity:.55;cursor:wait}.social{margin-top:30px;border-top:1px solid var(--r);padding-top:22px}.social-title{font-size:12px;color:var(--s);margin-bottom:14px}.social button{width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:10px;border:0;border-radius:12px;font:600 15px Pretendard;cursor:pointer;transition:filter .15s}.social button:hover{filter:brightness(.97)}.social button svg{width:22px;height:22px;flex:none}.social .kakao{background:#FEE500;color:#191919}.social .naver{background:#03A94D;color:#fff}.social .google{background:#fff;color:#1f1f1f;border:1px solid #747775}.last-login{font-size:12px;color:var(--s);text-align:center;margin:0 0 18px}.links{margin-top:25px;text-align:center;font-size:12px;color:var(--s)}.links a{color:var(--i);text-decoration:none;border-bottom:1px solid var(--i)}@media(max-width:600px){.top{height:72px}.box{padding-top:45px}.title{font-size:40px}}@media(prefers-reduced-motion:reduce){.social button{transition:none}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">LOGIN</div><h1 class="title">다시 만나서<br>반가워요.</h1><div class="field"><input id="authId" type="text" placeholder="이메일 또는 기존 아이디" autocomplete="username" required></div><div class="field"><input id="authPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required></div><p id="authMessage" role="status" style="font-size:12px;line-height:1.7;color:#8b4a4a"></p><button class="login" id="authSubmit" onclick="signIn()">이메일로 로그인 →</button><div class="links"><a href="forgot-password.html">비밀번호 찾기 / 재설정</a></div><div class="social"><div class="social-title">간편 로그인</div><p id="lastLoginHint" class="last-login" hidden></p><button class="kakao" type="button" onclick="socialLogin('kakao')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.52 2 10.86c0 2.78 1.83 5.22 4.59 6.62l-.94 3.44a.35.35 0 0 0 .53.38l4.05-2.68c.58.08 1.17.12 1.77.12 5.52 0 10-3.52 10-7.88S17.52 3 12 3Z"/></svg><span>카카오로 시작하기</span></button><button class="naver" type="button" onclick="socialLogin('naver')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6 4h4.2l3.8 5.3V4H18v16h-4.1L10 14.5V20H6z"/></svg><span>네이버로 시작하기</span></button><button class="google" type="button" onclick="socialLogin('google')"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18Z"/><path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/></svg><span>Google로 시작하기</span></button></div><div class="links">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></div></main></div><script src="neon-auth.js"></script><script>
const auth=window.LYT_AUTH_CLIENT;const alias=id=>id.trim().toLowerCase()+'@accounts.lastyear-today.app';
function setLoginCookie(provider){document.cookie='lyt_last_login='+encodeURIComponent(provider)+'; Max-Age=31536000; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'')}
function readLoginCookie(){const m=document.cookie.match(/(?:^|; )lyt_last_login=([^;]+)/);if(!m)return '';try{return decodeURIComponent(m[1])}catch(e){return ''}}
(function(){const p=readLoginCookie(),labels={kakao:'카카오',naver:'네이버',google:'Google'},hint=document.getElementById('lastLoginHint');if(labels[p]&&hint){hint.textContent='이전에 '+labels[p]+'로 로그인했어요';hint.hidden=false}})();
async function signIn(){const id=document.getElementById('authId').value.trim(),password=document.getElementById('authPassword').value,msg=document.getElementById('authMessage'),btn=document.getElementById('authSubmit');if(!id||!password){msg.textContent='이메일(또는 기존 아이디)과 비밀번호를 입력해 주세요.';return}btn.disabled=true;msg.textContent='로그인 중…';try{await window.LYT_AUTH_READY;let result;if(id.includes('@'))result=await auth.auth.signInWithPassword({email:id.toLowerCase(),password});else{if(!/^[a-zA-Z0-9_]{3,24}$/.test(id))throw new Error('이메일 또는 기존 아이디 형식을 확인해 주세요.');result=await auth.auth.signInWithPassword({email:alias(id),password})}if(result.error)throw result.error;setLoginCookie('email');const sr=await auth.getSession(),session=sr.data&&sr.data.session;if(session?.access_token){const ar=await fetch('/api/account',{headers:{'Authorization':'Bearer '+session.access_token}});if(ar.status===403){await auth.signOut();msg.textContent='탈퇴 접수된 계정은 로그인할 수 없습니다. 탈퇴 철회를 원하면 1:1 문의로 관리자에게 요청해 주세요.';return}}location.href='journals.html'}catch(e){msg.textContent='로그인에 실패했습니다. 이메일/아이디와 비밀번호를 확인해 주세요.'}finally{btn.disabled=false}}
async function socialLogin(provider){const msg=document.getElementById('authMessage'),labels={google:'Google',kakao:'카카오',naver:'네이버'};msg.textContent=labels[provider]+' 로그인으로 이동합니다…';try{await window.LYT_AUTH_READY;const {error}=await auth.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/journals.html'}});if(error)throw error;setLoginCookie(provider)}catch(e){msg.textContent=e.message||labels[provider]+' 로그인 연결에 실패했습니다.'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});</script></body></html>
