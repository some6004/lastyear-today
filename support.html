<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1:1 문의 — 작년, 오늘</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9;--c:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.page{max-width:850px;margin:auto;padding:0 24px}.top{height:82px;border-bottom:1px solid var(--r);display:flex;align-items:center;justify-content:space-between}.logo{font:28px Georgia,serif;text-decoration:none;color:var(--i)}.top a:last-child{font-size:12px}.main{padding:54px 0 90px}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:normal clamp(38px,7vw,58px) Georgia,serif;letter-spacing:-.06em;margin:14px 0}.lead{color:var(--s);font-size:14px;line-height:1.8;max-width:650px}.tabs{display:flex;gap:8px;margin:32px 0 20px;flex-wrap:wrap}.tab{padding:11px 15px;border:1px solid var(--r);background:transparent;cursor:pointer;font:13px Pretendard}.tab.active{background:var(--i);color:white;border-color:var(--i)}.panel{display:none}.panel.active{display:block}.field{margin:15px 0}.field label{display:block;font-size:12px;color:var(--s);margin-bottom:8px}.field input,.field textarea{width:100%;padding:13px;border:1px solid var(--r);background:var(--c);font:14px/1.7 Pretendard;color:var(--i);border-radius:0}.field textarea{min-height:150px;resize:vertical}.btn{border:0;border-bottom:1px solid var(--i);background:none;padding:13px 0;font:14px Pretendard;cursor:pointer}.msg{font-size:12px;line-height:1.8;color:var(--s);white-space:pre-wrap}.card{border:1px solid var(--r);background:var(--c);padding:22px;margin:14px 0}.meta{font-size:11px;color:var(--s);margin-bottom:12px}.bubble{padding:15px 0;border-top:1px solid var(--r);white-space:pre-wrap;line-height:1.8;font-size:14px}.bubble.admin{padding-left:15px;border-left:2px solid #b9c3b2;margin-top:14px}.bubble small{display:block;color:var(--s);font-size:11px;margin-bottom:7px}.hidden{display:none}.note{font-size:11px;line-height:1.7;color:var(--s);margin-top:16px}@media(max-width:600px){.main{padding-top:38px}.card{padding:16px}}</style><link rel="stylesheet" href="site-common.css">
</head><body><div class="page"><header class="top"><a class="logo" href="index.html">작년, 오늘</a><a href="index.html">메인으로</a></header><main class="main"><div class="ey">HELP & SUPPORT</div><h1 class="title">1:1 문의</h1><p class="lead">회원이 아니어도 문의할 수 있어요. 이름과 이메일을 임시 본인 정보로 사용해 문의를 작성하고, 문의번호로 답변을 확인할 수 있습니다. 문의번호는 꼭 저장해 주세요.</p><div class="tabs"><button class="tab active" data-panel="write">문의 작성</button><button class="tab" data-panel="lookup">내 문의 확인</button></div><section class="panel active" id="write"><form id="inquiryForm"><div class="field"><label for="name">이름</label><input id="name" required maxlength="80" autocomplete="name"></div><div class="field"><label for="email">이메일 주소</label><input id="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="subject">문의 제목</label><input id="subject" required maxlength="160"></div><div class="field"><label for="message">문의 내용</label><textarea id="message" required minlength="5" maxlength="10000"></textarea></div><p class="note">이름과 이메일은 문의 확인용으로 사용됩니다. 이름·이메일·문의번호가 일치해야 해당 문의와 답변을 조회할 수 있으므로 문의번호를 보관해 주세요. 민감한 비밀번호나 인증정보는 입력하지 마세요.</p><p class="msg" id="createMsg" role="status"></p><button class="btn" type="submit">문의 접수하기 →</button></form></section><section class="panel" id="lookup"><div class="field"><label for="lookupId">문의번호</label><input id="lookupId" inputmode="numeric" placeholder="접수 후 발급된 번호"></div><div class="field"><label for="lookupName">이름</label><input id="lookupName" autocomplete="name"></div><div class="field"><label for="lookupEmail">이메일 주소</label><input id="lookupEmail" type="email" autocomplete="email"></div><p class="msg" id="lookupMsg" role="status"></p><button class="btn" id="lookupBtn" type="button">문의 및 답변 확인 →</button><div id="thread"></div></section></main></div><script>
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel))}));
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=s=>s?new Date(s).toLocaleString('ko-KR'):'';
$('inquiryForm').addEventListener('submit',async e=>{e.preventDefault();$('createMsg').textContent='접수 중…';try{const r=await fetch('/api/inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim(),subject:$('subject').value.trim(),message:$('message').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'접수에 실패했습니다.');$('createMsg').textContent='문의가 접수되었습니다. 문의번호는 '+d.inquiry.id+'번입니다. 이 번호와 입력한 이름·이메일을 보관해 주세요.';$('lookupId').value=d.inquiry.id;$('lookupName').value=d.inquiry.name;$('lookupEmail').value=d.inquiry.email;$('message').value='';}catch(e){$('createMsg').textContent=e.message}});
$('lookupBtn').addEventListener('click',async()=>{const id=$('lookupId').value.trim(),name=$('lookupName').value.trim(),email=$('lookupEmail').value.trim();$('lookupMsg').textContent='조회 중…';$('thread').innerHTML='';try{const url='/api/inquiries?id='+encodeURIComponent(id)+'&name='+encodeURIComponent(name)+'&email='+encodeURIComponent(email);const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||'조회에 실패했습니다.');$('lookupMsg').textContent='문의 #'+d.inquiry.id+' · '+(d.inquiry.status==='answered'?'답변이 등록되었습니다.':'답변 대기 중입니다.');$('thread').innerHTML='<article class="card"><div class="meta">접수 '+esc(fmtDate(d.inquiry.created_at))+' · '+esc(d.inquiry.subject)+'</div>'+d.messages.map(m=>'<div class="bubble '+(m.sender_type==='admin'?'admin':'')+'"><small>'+esc(m.sender_name)+' · '+esc(fmtDate(m.created_at))+'</small>'+esc(m.message)+'</div>').join('')+'</article>'}catch(e){$('lookupMsg').textContent=e.message}});
</script><script src="site-common.js"></script>
</body></html>
