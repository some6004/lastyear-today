<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이메일 인증 — 작년, 오늘</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--p:#f3f0e9;--i:#24231f;--s:#77736b;--r:#d7d2c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Pretendard,sans-serif}.wrap{max-width:500px;margin:auto;padding:0 25px}.top{height:90px;display:flex;align-items:center}.logo{font:30px Georgia,serif;color:var(--i);text-decoration:none}.box{padding:55px 0}.ey{font-size:11px;letter-spacing:.18em;color:#8a857c}.title{font:normal 40px Georgia,serif;letter-spacing:-.05em;line-height:1.2;margin:18px 0 24px}.desc{font-size:13px;color:var(--s);line-height:1.8}.field{border-bottom:1px solid var(--r);padding:15px 0}.field input{width:100%;border:0;background:none;outline:0;font:15px Pretendard}.btn{width:100%;margin-top:25px;padding:16px;border:0;border-bottom:1px solid var(--i);background:none;font:500 14px Pretendard;cursor:pointer}#msg{font-size:12px;line-height:1.8;color:#8b4a4a}.links{margin-top:25px;text-align:center;font-size:12px}.links a{color:var(--i)}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">작년, 오늘</a></header><main class="box"><div class="ey">EMAIL VERIFICATION</div><h1 class="title">이메일을<br>인증해 주세요.</h1><p class="desc">가입한 이메일로 받은 인증 코드를 입력해 주세요. 메일이 보이지 않으면 스팸함도 확인해 주세요.</p><div class="field"><input id="email" type="email" placeholder="이메일 주소" autocomplete="email" required></div><div class="field"><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="이메일 인증 코드" required></div><p id="msg" role="status"></p><button class="btn" id="submit" onclick="verify()">이메일 인증 →</button><div class="links"><a href="login.html">로그인으로 돌아가기</a></div></main></div><script src="neon-auth.js"></script><script>const emailInput=document.getElementById('email');emailInput.value=new URLSearchParams(location.search).get('email')||'';async function verify(){const email=emailInput.value.trim().toLowerCase();const token=document.getElementById('code').value.trim();const msg=document.getElementById('msg');const btn=document.getElementById('submit');if(!email||!token){msg.textContent='이메일과 인증 코드를 입력해 주세요.';return}btn.disabled=true;msg.textContent='인증 중…';try{await window.LYT_AUTH_READY;const {error}=await window.LYT_AUTH_CLIENT.auth.verifyOtp({email,token,type:'signup'});if(error)throw error;msg.style.color='#77736b';msg.textContent='이메일 인증이 완료되었습니다. 로그인해 주세요.';btn.textContent='인증 완료';}catch(e){msg.textContent='인증에 실패했습니다. 코드가 만료되었거나 올바르지 않습니다. 다시 요청해 주세요.';btn.disabled=false}}</script></body></html>
